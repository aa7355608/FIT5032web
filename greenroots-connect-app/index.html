<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy (BR C.4). Scripts may only come from this origin
      plus apis.google.com (Firebase Auth's Google sign-in popup loads it);
      network calls are limited to this origin and Google/Firebase endpoints.
      Clickjacking protection (frame-ancestors / X-Frame-Options) can't be set
      from a <meta> tag, so it is sent as an HTTP header in public/_headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://routing.openstreetmap.de; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; base-uri 'self'; object-src 'none'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>GreenRoots Connect — Urban Greening & Tree Planting</title>
    <meta name="description" content="Find, join and track local tree-planting and urban greening events across Melbourne." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
